<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ねこブロック - 猫落下パズル</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: linear-gradient(160deg, #2b2140 0%, #171225 60%, #0d0b16 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    color: #f4ecff;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    padding: 10px 8px 6px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 20px;
    letter-spacing: 2px;
    color: #ffd7ea;
    text-shadow: 0 0 12px rgba(255,150,210,0.5);
  }
  #main {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    flex: 1;
    min-height: 0;
  }
  #boardWrap {
    position: relative;
    border-radius: 14px;
    padding: 6px;
    background: rgba(255,255,255,0.04);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.08), 0 10px 30px rgba(0,0,0,0.5);
  }
  canvas#board {
    display: block;
    border-radius: 8px;
    background: radial-gradient(ellipse at 50% 0%, #23193a 0%, #140f22 100%);
  }
  #side {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 92px;
  }
  .panel {
    background: rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 8px;
    text-align: center;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
  }
  .panel .label {
    font-size: 10px;
    color: #c9b8e8;
    letter-spacing: 1px;
    margin-bottom: 3px;
  }
  .panel .value {
    font-size: 16px;
    font-weight: 700;
    color: #fff0f8;
  }
  canvas#next {
    display: block;
    margin: 0 auto;
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
  }
  #overlay {
    position: fixed; inset: 0;
    background: rgba(10, 6, 20, 0.88);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
    z-index: 20;
  }
  #overlay.show { display: flex; }
  #overlay .big { font-size: 46px; margin-bottom: 6px; }
  #overlay h2 { margin: 0 0 4px; font-size: 22px; color: #ffd7ea; }
  #overlay p { margin: 2px 0 16px; color: #d8c8f0; font-size: 14px; }
  button.mainbtn {
    background: linear-gradient(135deg, #ff9ecb, #b48cff);
    border: none;
    color: #201230;
    font-weight: 700;
    font-size: 15px;
    padding: 12px 26px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(180,140,255,0.4);
  }
  #levelGrid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 18px;
    width: min(320px, 78vw);
  }
  .levelBtn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    color: #f4ecff;
    font-weight: 700;
    font-size: 16px;
    padding: 12px 0;
    border-radius: 10px;
  }
  .levelBtn.selected {
    background: linear-gradient(135deg, #ff9ecb, #b48cff);
    color: #201230;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.5);
  }
  #nameEntry {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    width: min(320px, 78vw);
  }
  #nameEntry.show { display: flex; }
  #nameEntry input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.1);
    color: #fff0f8;
    font-size: 15px;
    text-align: center;
  }
  #nameEntry input::placeholder { color: rgba(244,236,255,0.5); }
  #saveScoreBtn {
    background: linear-gradient(135deg, #8effc1, #7ee0ff);
    border: none;
    color: #14231c;
    font-weight: 700;
    font-size: 13px;
    padding: 8px 20px;
    border-radius: 999px;
  }
  #savedMsg {
    font-size: 12px;
    color: #b6ffd8;
    height: 14px;
    margin: -2px 0 2px;
  }
  #leaderboard {
    width: min(320px, 78vw);
    margin-bottom: 14px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 8px 12px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
  }
  #leaderboard .lbTitle {
    font-size: 11px;
    letter-spacing: 1px;
    color: #c9b8e8;
    margin-bottom: 4px;
    text-align: left;
  }
  .lbRow {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 3px 0;
    color: #f4ecff;
  }
  .lbRow .lbRank { width: 22px; color: #ffd7ea; font-weight: 700; }
  .lbRow .lbName { flex: 1; text-align: left; padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lbRow .lbScore { font-weight: 700; }
  .lbEmpty { font-size: 12px; color: rgba(244,236,255,0.5); padding: 4px 0; }
  #controls {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    width: 100%;
    max-width: 380px;
    margin-top: 8px;
  }
  .ctrlbtn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #f4ecff;
    border-radius: 10px;
    padding: 12px 0;
    font-size: 18px;
    text-align: center;
  }
  .ctrlbtn:active { background: rgba(255,255,255,0.22); }
  #toast {
    position: fixed;
    top: 12%;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: rgba(255,255,255,0.9);
    color: #4a2f6b;
    font-weight: 800;
    font-size: 15px;
    padding: 8px 18px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 30;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <h1>🐾 ねこブロック 🐾</h1>
  <div id="main">
    <div id="boardWrap">
      <canvas id="board"></canvas>
    </div>
    <div id="side">
      <div class="panel">
        <div class="label">つぎ</div>
        <canvas id="next" width="76" height="76"></canvas>
      </div>
      <div class="panel">
        <div class="label">スコア</div>
        <div class="value" id="scoreVal">0</div>
      </div>
      <div class="panel">
        <div class="label">ライン</div>
        <div class="value" id="linesVal">0</div>
      </div>
      <div class="panel">
        <div class="label">レベル</div>
        <div class="value" id="levelVal">1</div>
      </div>
    </div>
  </div>
  <div id="controls">
    <div class="ctrlbtn" id="btnLeft">◀</div>
    <div class="ctrlbtn" id="btnRotate">⟳</div>
    <div class="ctrlbtn" id="btnRight">▶</div>
    <div class="ctrlbtn" id="btnDown">▼</div>
  </div>
</div>

<div id="toast"></div>

<div id="overlay">
  <div class="big" id="overEmoji">😿</div>
  <h2 id="overTitle">ゲームオーバー</h2>
  <p id="overSub">猫たちが積み上がってしまいました</p>
  <div id="nameEntry">
    <input type="text" id="nameInput" placeholder="なまえ（にゃんこの名前でもOK）" maxlength="10">
    <button id="saveScoreBtn">ランキングにとうろく</button>
    <div id="savedMsg"></div>
  </div>
  <div id="leaderboard">
    <div class="lbTitle">🏆 ハイスコア（このセッション）</div>
    <div id="lbList"></div>
  </div>
  <div id="levelGrid"></div>
  <button class="mainbtn" id="restartBtn">もう一回あそぶ</button>
</div>

<script>
(function () {
  "use strict";

  var COLS = 9, ROWS = 16;
  var boardCanvas = document.getElementById("board");
  var ctx = boardCanvas.getContext("2d");
  var nextCanvas = document.getElementById("next");
  var nctx = nextCanvas.getContext("2d");

  function computeCell() {
    var maxW = Math.min(window.innerWidth - 130, 320);
    var maxH = window.innerHeight - 160;
    var cw = Math.floor(maxW / COLS);
    var ch = Math.floor(maxH / ROWS);
    return Math.max(14, Math.min(cw, ch, 26));
  }
  var CELL = computeCell();
  boardCanvas.width = COLS * CELL;
  boardCanvas.height = ROWS * CELL;

  // --- 猫のポーズ定義（種類ごとに色・表情・ポーズが違う） ---
  var CATS = {
    I: { color: "#8ecbff", ear: "up",   eye: "sleepy",  mouth: "line",  name: "のびのび猫" },
    O: { color: "#ffd36e", ear: "flat", eye: "closed",  mouth: "smile", name: "香箱猫" },
    T: { color: "#ff9ecb", ear: "up",   eye: "open",    mouth: "meow",  name: "ジャンプ猫" },
    S: { color: "#8effc1", ear: "back", eye: "wink",    mouth: "smile", name: "まるまる猫" },
    Z: { color: "#c39bff", ear: "back", eye: "wink2",   mouth: "meow",  name: "だらん猫" },
    J: { color: "#7ee0ff", ear: "up",   eye: "open",    mouth: "line",  name: "見上げ猫" },
    L: { color: "#ffb37e", ear: "flat", eye: "open",    mouth: "smile", name: "ふみふみ猫" }
  };

  var SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };
  var TYPES = Object.keys(SHAPES);

  function rotateCells(cells) {
    // rotate around 1.5,1.5 (4x4 box) -> (x,y) -> (3-y, x)
    var out = [];
    for (var i = 0; i < cells.length; i++) {
      var x = cells[i][0], y = cells[i][1];
      out.push([3 - y, x]);
    }
    return out;
  }

  function newPiece(type) {
    return {
      type: type,
      cells: SHAPES[type].map(function (c) { return c.slice(); }),
      x: type === "O" ? 3 : 3,
      y: -1
    };
  }

  function randType() {
    return TYPES[Math.floor(Math.random() * TYPES.length)];
  }

  var grid, current, nextType, score, lines, level, dropInterval, dropTimer, gameOver, paused;
  var lastTime = 0;
  var rafId = null;
  var clearingRows = [];
  var clearAnimTimer = 0;
  var selectedLevel = 1;
  var started = false;
  var highScores = [];
  var MAX_SCORES = 5;
  var scoreSaved = false;

  var LEVEL_SPEED = [750, 660, 580, 500, 430, 360, 300, 240, 190, 140];

  function initGame(startLevel) {
    grid = [];
    for (var r = 0; r < ROWS; r++) {
      grid.push(new Array(COLS).fill(null));
    }
    current = newPiece(randType());
    nextType = randType();
    score = 0; lines = 0;
    level = startLevel || 1;
    dropInterval = LEVEL_SPEED[level - 1] || 140;
    gameOver = false; paused = false;
    clearingRows = [];
    updateHUD();
    document.getElementById("overlay").classList.remove("show");
    drawNext();
  }

  function buildLevelGrid() {
    var wrap = document.getElementById("levelGrid");
    wrap.innerHTML = "";
    for (var i = 1; i <= 10; i++) {
      (function (lv) {
        var b = document.createElement("div");
        b.className = "levelBtn" + (lv === selectedLevel ? " selected" : "");
        b.textContent = lv;
        b.addEventListener("click", function () {
          selectedLevel = lv;
          buildLevelGrid();
        });
        b.addEventListener("touchstart", function (e) {
          e.preventDefault();
          selectedLevel = lv;
          buildLevelGrid();
        }, {passive:false});
        wrap.appendChild(b);
      })(i);
    }
  }

  function showStartScreen() {
    started = false;
    paused = true;
    document.getElementById("overEmoji").textContent = "😺";
    document.getElementById("overTitle").textContent = "レベルをえらんでね";
    document.getElementById("overSub").textContent = "1はゆっくり・10ははやい";
    document.getElementById("restartBtn").textContent = "はじめる！";
    document.getElementById("nameEntry").classList.remove("show");
    buildLevelGrid();
    renderLeaderboard();
    document.getElementById("overlay").classList.add("show");
  }

  function cellsAbs(piece) {
    return piece.cells.map(function (c) { return [piece.x + c[0], piece.y + c[1]]; });
  }

  function collides(piece, dx, dy, cells) {
    var cc = cells || piece.cells;
    for (var i = 0; i < cc.length; i++) {
      var x = piece.x + cc[i][0] + dx;
      var y = piece.y + cc[i][1] + dy;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }

  function lockPiece() {
    var abs = cellsAbs(current);
    for (var i = 0; i < abs.length; i++) {
      var x = abs[i][0], y = abs[i][1];
      if (y < 0) { triggerGameOver(); return; }
      grid[y][x] = current.type;
    }
    checkLines();
    spawnNext();
  }

  function checkLines() {
    var full = [];
    for (var r = 0; r < ROWS; r++) {
      var isFull = true;
      for (var c = 0; c < COLS; c++) {
        if (!grid[r][c]) { isFull = false; break; }
      }
      if (isFull) full.push(r);
    }
    if (full.length > 0) {
      clearingRows = full;
      clearAnimTimer = 260;
      var pts = [0, 100, 300, 600, 1000][full.length] * level;
      score += pts;
      lines += full.length;
      var newLevel = Math.floor(lines / 8) + 1;
      if (newLevel !== level) {
        level = newLevel;
        dropInterval = Math.max(140, 750 - (level - 1) * 65);
      }
      updateHUD();
      showToast(full.length >= 4 ? "にゃーっ！！ すごい！" : "にゃー♪");
      setTimeout(function () {
        removeClearedRows(full);
        clearingRows = [];
      }, 240);
    }
  }

  function removeClearedRows(full) {
    full.sort(function (a, b) { return a - b; });
    for (var i = 0; i < full.length; i++) {
      grid.splice(full[i], 1);
      grid.unshift(new Array(COLS).fill(null));
    }
  }

  function spawnNext() {
    current = newPiece(nextType);
    nextType = randType();
    drawNext();
    if (collides(current, 0, 0)) {
      triggerGameOver();
    }
  }

  function qualifiesForBoard(s) {
    if (s <= 0) return false;
    if (highScores.length < MAX_SCORES) return true;
    return s > highScores[highScores.length - 1].score;
  }

  function renderLeaderboard() {
    var list = document.getElementById("lbList");
    if (highScores.length === 0) {
      list.innerHTML = '<div class="lbEmpty">まだ記録がないよ。あそんでみよう！</div>';
      return;
    }
    var html = "";
    for (var i = 0; i < highScores.length; i++) {
      var e = highScores[i];
      html += '<div class="lbRow"><span class="lbRank">' + (i + 1) + '</span>' +
        '<span class="lbName">' + escapeHtml(e.name) + '</span>' +
        '<span class="lbScore">' + e.score + '</span></div>';
    }
    list.innerHTML = html;
  }

  function escapeHtml(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function saveScore(name, s, lv) {
    highScores.push({ name: name, score: s, level: lv });
    highScores.sort(function (a, b) { return b.score - a.score; });
    highScores = highScores.slice(0, MAX_SCORES);
    renderLeaderboard();
  }

  function triggerGameOver() {
    gameOver = true;
    document.getElementById("overEmoji").textContent = "😿";
    document.getElementById("overTitle").textContent = "ゲームオーバー";
    document.getElementById("overSub").textContent = "スコア " + score + " ・ ライン " + lines;
    document.getElementById("restartBtn").textContent = "もう一回あそぶ";
    buildLevelGrid();
    renderLeaderboard();
    scoreSaved = false;
    document.getElementById("savedMsg").textContent = "";
    document.getElementById("nameInput").value = "";
    var nameEntry = document.getElementById("nameEntry");
    if (qualifiesForBoard(score)) {
      nameEntry.classList.add("show");
    } else {
      nameEntry.classList.remove("show");
    }
    document.getElementById("overlay").classList.add("show");
  }

  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._h);
    showToast._h = setTimeout(function () { t.classList.remove("show"); }, 700);
  }

  function updateHUD() {
    document.getElementById("scoreVal").textContent = score;
    document.getElementById("linesVal").textContent = lines;
    document.getElementById("levelVal").textContent = level;
  }

  // --- 描画：猫の顔をセルに描く ---
  function drawCat(c, px, py, size, cat) {
    var cx = px + size / 2, cy = py + size / 2;
    var r = size * 0.42;
    c.save();
    c.translate(cx, cy);

    // body/base circle
    c.beginPath();
    c.fillStyle = cat.color;
    c.arc(0, 0, r, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = "rgba(0,0,0,0.18)";
    c.lineWidth = Math.max(1, size * 0.03);
    c.stroke();

    // ears
    c.fillStyle = cat.color;
    var earOffsetY = cat.ear === "flat" ? -r * 0.55 : -r * 0.85;
    var earSpread = cat.ear === "back" ? r * 0.75 : r * 0.55;
    c.beginPath();
    c.moveTo(-earSpread, earOffsetY + r * 0.35);
    c.lineTo(-earSpread * 0.35, -r * 1.15);
    c.lineTo(-earSpread * 0.05, earOffsetY + r * 0.55);
    c.closePath();
    c.fill();
    c.beginPath();
    c.moveTo(earSpread, earOffsetY + r * 0.35);
    c.lineTo(earSpread * 0.35, -r * 1.15);
    c.lineTo(earSpread * 0.05, earOffsetY + r * 0.55);
    c.closePath();
    c.fill();

    // eyes
    c.fillStyle = "#241533";
    var ex = r * 0.32, ey = -r * 0.05;
    if (cat.eye === "closed") {
      c.strokeStyle = "#241533";
      c.lineWidth = Math.max(1, size * 0.045);
      c.beginPath(); c.moveTo(-ex - r*0.15, ey); c.quadraticCurveTo(-ex, ey + r*0.18, -ex + r*0.15, ey); c.stroke();
      c.beginPath(); c.moveTo(ex - r*0.15, ey); c.quadraticCurveTo(ex, ey + r*0.18, ex + r*0.15, ey); c.stroke();
    } else if (cat.eye === "sleepy") {
      c.fillRect(-ex - r*0.14, ey, r*0.28, r*0.10);
      c.fillRect(ex - r*0.14, ey, r*0.28, r*0.10);
    } else if (cat.eye === "wink") {
      c.beginPath(); c.arc(-ex, ey, r*0.11, 0, Math.PI * 2); c.fill();
      c.strokeStyle = "#241533"; c.lineWidth = Math.max(1, size*0.04);
      c.beginPath(); c.moveTo(ex - r*0.15, ey); c.quadraticCurveTo(ex, ey + r*0.15, ex + r*0.15, ey); c.stroke();
    } else if (cat.eye === "wink2") {
      c.beginPath(); c.arc(ex, ey, r*0.11, 0, Math.PI * 2); c.fill();
      c.strokeStyle = "#241533"; c.lineWidth = Math.max(1, size*0.04);
      c.beginPath(); c.moveTo(-ex - r*0.15, ey); c.quadraticCurveTo(-ex, ey + r*0.15, -ex + r*0.15, ey); c.stroke();
    } else {
      c.beginPath(); c.arc(-ex, ey, r*0.12, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(ex, ey, r*0.12, 0, Math.PI * 2); c.fill();
    }

    // nose
    c.fillStyle = "#e5789f";
    c.beginPath();
    c.moveTo(-r*0.07, r*0.15);
    c.lineTo(r*0.07, r*0.15);
    c.lineTo(0, r*0.27);
    c.closePath();
    c.fill();

    // mouth
    c.strokeStyle = "#241533";
    c.lineWidth = Math.max(1, size * 0.035);
    if (cat.mouth === "meow") {
      c.beginPath();
      c.arc(0, r*0.35, r*0.18, 0.15 * Math.PI, 0.85 * Math.PI);
      c.stroke();
    } else if (cat.mouth === "smile") {
      c.beginPath();
      c.moveTo(0, r*0.27);
      c.quadraticCurveTo(-r*0.15, r*0.42, -r*0.28, r*0.3);
      c.moveTo(0, r*0.27);
      c.quadraticCurveTo(r*0.15, r*0.42, r*0.28, r*0.3);
      c.stroke();
    } else {
      c.beginPath();
      c.moveTo(-r*0.12, r*0.32);
      c.lineTo(r*0.12, r*0.32);
      c.stroke();
    }

    // whiskers
    c.strokeStyle = "rgba(36,21,51,0.55)";
    c.lineWidth = Math.max(1, size * 0.02);
    [-1, 1].forEach(function (side) {
      for (var w = -1; w <= 1; w++) {
        c.beginPath();
        c.moveTo(side * r * 0.55, r * 0.12 + w * r * 0.09);
        c.lineTo(side * r * 1.0, r * 0.05 + w * r * 0.14);
        c.stroke();
      }
    });

    c.restore();
  }

  function drawCell(c, gx, gy, type, sizeOverride, ox, oy) {
    var size = sizeOverride || CELL;
    var px = (ox !== undefined ? ox : gx * CELL) + 1;
    var py = (oy !== undefined ? oy : gy * CELL) + 1;
    drawCat(c, px, py, size - 2, CATS[type]);
  }

  function drawBoard() {
    ctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);

    // grid lines
    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    ctx.lineWidth = 1;
    for (var x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, ROWS * CELL); ctx.stroke();
    }
    for (var y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(COLS * CELL, y * CELL); ctx.stroke();
    }

    // locked cells
    for (var r = 0; r < ROWS; r++) {
      for (var cIdx = 0; cIdx < COLS; cIdx++) {
        var t = grid[r][cIdx];
        if (t) {
          if (clearingRows.indexOf(r) !== -1) {
            ctx.save();
            ctx.globalAlpha = 0.35;
            drawCell(ctx, cIdx, r, t);
            ctx.restore();
          } else {
            drawCell(ctx, cIdx, r, t);
          }
        }
      }
    }

    // ghost piece
    if (!gameOver && current) {
      var gy = current.y;
      while (!collides(current, 0, gy - current.y + 1)) gy++;
      ctx.save();
      ctx.globalAlpha = 0.18;
      current.cells.forEach(function (cel) {
        var x = current.x + cel[0], y = gy + cel[1];
        if (y >= 0) drawCell(ctx, x, y, current.type);
      });
      ctx.restore();
    }

    // current piece
    if (!gameOver && current) {
      current.cells.forEach(function (cel) {
        var x = current.x + cel[0], y = current.y + cel[1];
        if (y >= 0) drawCell(ctx, x, y, current.type);
      });
    }
  }

  function drawNext() {
    nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    var cells = SHAPES[nextType];
    var minX = Math.min.apply(null, cells.map(function(c){return c[0];}));
    var maxX = Math.max.apply(null, cells.map(function(c){return c[0];}));
    var minY = Math.min.apply(null, cells.map(function(c){return c[1];}));
    var maxY = Math.max.apply(null, cells.map(function(c){return c[1];}));
    var w = maxX - minX + 1, h = maxY - minY + 1;
    var size = Math.min(nextCanvas.width / (w + 0.6), nextCanvas.height / (h + 0.6));
    var offX = (nextCanvas.width - w * size) / 2;
    var offY = (nextCanvas.height - h * size) / 2;
    cells.forEach(function (c) {
      drawCell(nctx, 0, 0, nextType, size, offX + (c[0]-minX) * size, offY + (c[1]-minY) * size);
    });
  }

  // --- controls ---
  function move(dx) {
    if (gameOver || paused) return;
    if (!collides(current, dx, 0)) current.x += dx;
    drawBoard();
  }

  function softDrop() {
    if (gameOver || paused) return;
    if (!collides(current, 0, 1)) {
      current.y += 1;
      score += 1;
      updateHUD();
    } else {
      lockPiece();
    }
    drawBoard();
  }

  function hardDrop() {
    if (gameOver || paused) return;
    var dist = 0;
    while (!collides(current, 0, dist + 1)) dist++;
    current.y += dist;
    score += dist * 2;
    updateHUD();
    lockPiece();
    drawBoard();
  }

  function rotate() {
    if (gameOver || paused) return;
    var rotated = rotateCells(current.cells);
    var kicks = [0, -1, 1, -2, 2];
    for (var i = 0; i < kicks.length; i++) {
      if (!collides(current, kicks[i], 0, rotated)) {
        current.cells = rotated;
        current.x += kicks[i];
        drawBoard();
        return;
      }
    }
  }

  document.addEventListener("keydown", function (e) {
    if (["ArrowLeft","ArrowRight","ArrowDown","ArrowUp"," "].indexOf(e.key) !== -1) e.preventDefault();
    if (e.key === "ArrowLeft") move(-1);
    else if (e.key === "ArrowRight") move(1);
    else if (e.key === "ArrowDown") softDrop();
    else if (e.key === "ArrowUp") rotate();
    else if (e.key === " ") hardDrop();
  });

  function bindHold(el, fn) {
    el.addEventListener("touchstart", function (e) { e.preventDefault(); fn(); }, {passive:false});
    el.addEventListener("mousedown", function (e) { e.preventDefault(); fn(); });
  }
  bindHold(document.getElementById("btnLeft"), function(){ move(-1); });
  bindHold(document.getElementById("btnRight"), function(){ move(1); });
  bindHold(document.getElementById("btnRotate"), rotate);
  bindHold(document.getElementById("btnDown"), softDrop);

  var touchStartX = null, touchStartY = null, touchMoved = false;
  boardCanvas.addEventListener("touchstart", function (e) {
    var t = e.touches[0];
    touchStartX = t.clientX; touchStartY = t.clientY; touchMoved = false;
  }, {passive:true});
  boardCanvas.addEventListener("touchend", function (e) {
    if (!touchMoved) rotate();
    touchStartX = null;
  }, {passive:true});
  boardCanvas.addEventListener("touchmove", function (e) {
    if (touchStartX === null) return;
    var t = e.touches[0];
    var dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
    if (Math.abs(dx) > CELL * 0.8) {
      move(dx > 0 ? 1 : -1);
      touchStartX = t.clientX;
      touchMoved = true;
    } else if (dy > CELL * 1.2) {
      hardDrop();
      touchStartX = null;
      touchMoved = true;
    }
  }, {passive:true});

  document.getElementById("saveScoreBtn").addEventListener("click", function () {
    if (scoreSaved) return;
    var name = document.getElementById("nameInput").value.trim();
    if (!name) name = "なまえなし猫";
    saveScore(name, score, level);
    scoreSaved = true;
    document.getElementById("savedMsg").textContent = "とうろくしました！🐾";
    document.getElementById("saveScoreBtn").disabled = true;
    document.getElementById("saveScoreBtn").style.opacity = "0.5";
  });

  document.getElementById("nameInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("saveScoreBtn").click();
  });

  document.getElementById("restartBtn").addEventListener("click", function () {
    started = true;
    document.getElementById("saveScoreBtn").disabled = false;
    document.getElementById("saveScoreBtn").style.opacity = "1";
    initGame(selectedLevel);
    lastTime = performance.now();
  });

  function loop(ts) {
    if (!lastTime) lastTime = ts;
    var dt = ts - lastTime;
    lastTime = ts;
    if (!gameOver && !paused && clearingRows.length === 0) {
      dropTimer = (dropTimer || 0) + dt;
      if (dropTimer > dropInterval) {
        dropTimer = 0;
        softDrop();
      }
    }
    drawBoard();
    rafId = requestAnimationFrame(loop);
  }

  initGame(1);
  showStartScreen();
  rafId = requestAnimationFrame(loop);

  window.addEventListener("resize", function () {
    CELL = computeCell();
    boardCanvas.width = COLS * CELL;
    boardCanvas.height = ROWS * CELL;
  });
})();
</script>
</body>
</html>
